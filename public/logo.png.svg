<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fundo escuro executivo -->
  <rect width="200" height="200" rx="40" fill="#0F172A"/>
  
  <g transform="translate(100, 100)">
    <!-- Bloco Esquerdo Superior -->
    <path d="M -40,-50 L 0,-20 L 0,20 L -40,-10 Z" fill="#E76F51"/>
    
    <!-- Bloco Direito (Acento Jaspe) -->
    <path d="M 5,-20 L 40,-40 L 40,30 L 5,50 Z" fill="#C85A32"/>
    
    <!-- Base Curva que completa o 'J' sutil -->
    <path d="M -40,5 L 0,35 L 0,55 L -40,25 Z" fill="#2A9D8F"/>
    
    <!-- Detalhe da Faceta interna -->
    <polygon points="5,-20 20,-10 20,40 5,50" fill="#F4A261" opacity="0.8"/>
  </g>
</svg>
